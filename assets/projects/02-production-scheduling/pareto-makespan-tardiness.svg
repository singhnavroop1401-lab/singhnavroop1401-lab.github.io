<text class="mut ti" x="526.7" y="399" text-anchor="middle">60</text>
<text class="mut ti" x="640.4" y="399" text-anchor="middle">75</text>
<line class="ax" x1="72" y1="380" x2="648" y2="380"/>
<line class="ax" x1="72" y1="68" x2="72" y2="380"/>
<path class="gr" style="stroke-dasharray:4 4" d="M299.7,337.7 L578.7,380.0"/>
<text class="ink s" x="360.0" y="424" text-anchor="middle">Makespan (h)</text>
<text class="ink s" transform="translate(19,224.0) rotate(-90)" text-anchor="middle">Total tardiness (h)</text>
<circle class="ink" cx="355.4" cy="262.2" r="4.5"/>
<text class="ink lb" x="355.4" y="248.2" text-anchor="middle">S1 Family</text>
<circle class="acc" cx="578.7" cy="380.0" r="6"/>
