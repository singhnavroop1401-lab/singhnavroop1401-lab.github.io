<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="1200" height="777" role="img" aria-label="Makespan versus total tardiness across five release strategies">
<style>
 .ink{fill:var(--chart-ink,#0a0a0a)} .acc{fill:var(--chart-accent,#2e5bff)} .mut{fill:var(--chart-muted,#5f5f5a)}
 .ax{stroke:var(--chart-ink,#0a0a0a);stroke-width:1;fill:none}
 .gr{stroke:var(--chart-grid,#dedcd5);stroke-width:1;fill:none}
 .ln{stroke:var(--chart-accent,#2e5bff);stroke-width:2;fill:none;stroke-linejoin:round}
 text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .t{font-size:15px;font-weight:600} .s{font-size:11.5px}
 .lb{font-size:11px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace} .ti{font-size:10.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
</style>
<rect width="680" height="440" fill="var(--chart-bg,#ffffff)"/>
<text class="ink t" x="72" y="28">Makespan vs total tardiness</text>
<text class="mut s" x="72" y="47">100 orders / 1,050 units, deterministic seeds. Lower-left is better.</text>
